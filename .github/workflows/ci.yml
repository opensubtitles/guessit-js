name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx vitest run test/guessit.test.ts

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash
      - name: Build WASM (downloads pinned Javy)
        run: bash wasm/build.sh
      - name: Test WASM against fixtures
        run: npx vitest run test/wasm-full.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: guessit-wasm
          path: |
            wasm/guessit.wasm
            wasm/guessit.wasm.gz
