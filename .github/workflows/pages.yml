name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Build WASM for the demo (downloads pinned Javy)
        run: bash wasm/build.sh

      - name: Regenerate output schema (keeps /docs current)
        run: npm run schema

      - name: Refresh Pages assets (copies wasm into public/)
        run: npm run build:pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate live Python guessit comparison for the demo
        run: |
          pip install --quiet guessit
          python scripts/python-compare.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
