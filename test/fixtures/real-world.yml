# Regression cases for patterns seen in production traffic (2026-11 replay).
# Names are synthetic or sanitised — never raw log data.

# IPTV prefixes that are NOT languages stay in the title
? 'csi: some city s01e01'
: title: 'csi: some city'
  season: 1
  episode: 1
  -language: ces

? law & order s01e01
: title: law & order
  -language: law

# "UK:" in IPTV lists is the country, not Ukrainian
? 'uk: some channel hd'
: title: some channel
  country: GB
  -language: ukr

# a language code inside a normal release name is untouched
? Some.Movie.2020.en.srt
: title: Some Movie
  year: 2020
  subtitle_language: en

# IPTV "<lang>:" prefix (Python agrees)
? 'pl: some channel hd'
: title: some channel
  language: pl

# a bare 2/3-letter code of a language outside Python's default set is a word, not a language
? Kaizoku-dan S01E01
: title: Kaizoku-dan
  -language: da

? Ben 10 S01E01
: title: Ben 10
  -language: bn

? of ice and men S01E01
: title: of ice and men
  -language: is

? cerebro del mal 1958
: title: cerebro del mal
  -language: ml

? dear chi
: title: dear chi
  -language: zh

# …but an enclosed code is a tag
? '[tr] some channel 1 hd'
: language: tr
  title: some channel 1

# "HR-HDTV" is a High Resolution HDTV source, not Croatian in an "Hdtv" script
? Some.Show.S05E04.Chi_Eng.HR-HDTV.AAC.1024X576.x264-GRP.mkv
: title: Some Show
  season: 5
  episode: 4
  language: en
  source: HDTV
  other: High Resolution
  -language: hr

# a real ISO 15924 script subtag is kept
? Some.Movie.2020.zh-Hans.srt
: title: Some Movie
  subtitle_language: zh-Hans
