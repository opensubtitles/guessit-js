# Cases from upstream guessit's own test suite (guessit/test/rules/processors.yml)
# that this port did not carry. Imported 2026-11-10 from guessit 4.5.1.

# Multiple input strings having same expected results can be chained.
# Use $ marker to check inputs that should not match results.

# Prefer information for last path.
? Some movie (2000)/Some movie (2001).mkv
? Some movie (2001)/Some movie.mkv
: year: 2001
  container: mkv
