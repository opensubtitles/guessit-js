# Cases from upstream guessit's own rule-level test suite (guessit/test/rules/*.yml)
# that this port does not satisfy yet. Imported 2026-11-10 from guessit 4.5.1 and
# quarantined here: this file is NOT in FIXTURE_FILES, so it does not run. Work
# through it by moving blocks back into the matching upstream-rules-*.yml file.
# Buckets are summarised in docs/upstream-issues.md.

# from upstream-corpus-episodes.yml
? '[Golumpa] Star Blazers 2202 - 22 (a.k.a. Yamato 2022) whatever'
: release_group: Golumpa
  title: Star Blazers 2202
  episode: 22
  year: 2022
  season: 2022
  episode_title: whatever
  type: episode

# from upstream-corpus-episodes.yml
? '[SubsPlease] Fairy Tail - 100 Years Quest - 05 (1080p)'
: release_group: SubsPlease
  title: Fairy Tail
  alternative_title: 100 Years Quest
  episode: 5
  screen_size: 1080p
  type: episode

# An absolute episode number in parentheses must not double-count the episode (#875)

# from upstream-corpus-episodes.yml
? '[Hatsuyuki] Dragon Ball Kai (2014) - 002 (100) test'
: release_group: Hatsuyuki
  title: Dragon Ball Kai
  year: 2014
  season: 2014
  episode: 2
  episode_title: test
  type: episode

# from upstream-corpus-episodes.yml
? '[Deep] Tegami Bachi (REVERSE) - Letter Bee - 29 (04) test'
: release_group: Deep
  title: Tegami Bachi
  episode_title: Letter Bee - 29
  episode: 4
  type: episode

# "Season N - EE" is season N, episode EE, not a season range N..EE (#875)

# from upstream-corpus-episodes.yml
? Show 12 - 24
: title: Show
  episode: [12, 24]

# A spaced western box-set range ("Season 1 - 5") must stay a season list: the "N - EE"
# reinterpretation is restricted to anime-signalled releases, since this convention clashes
# with the anime "Season N - EE" = season N episode EE reading (#920)

# from upstream-corpus-episodes.yml
? Mr.Robot.S01E01.eps1.0_hellofriend.mov.1080p.BluRay.DD5.1.x264-SA89.mkv
: title: Mr Robot
  season: 1
  episode: 1
  episode_title: eps1.0 hellofriend
  release_group: SA89

# A YYYY-YYYY year range is a single year range, bracketed or not (#988)

# from upstream-corpus-movies.yml
? The.Taking.of.Pelham.1.2.3.2009.1080p.BluRay.DTS.x264-EbP
: options: -t movie
  title: The Taking of Pelham 1.2.3
  year: 2009
  screen_size: 1080p
  source: Blu-ray
  audio_codec: DTS
  video_codec: H.264
  release_group: EbP
  type: movie
  -date: 2009-03-02

# A bare 1.0/2.0 in the title zone (before the year) numbers the title, it is not a channel layout.

# from upstream-corpus-movies.yml
? Evangelion.1.0.You.Are.Not.Alone.2007.1080p.BluRay.x264-GRP
: year: 2007
  screen_size: 1080p
  source: Blu-ray
  video_codec: H.264
  release_group: GRP
  type: movie
  -audio_channels: '1.0'

# A channel layout glued to its codec stays a channel layout, even before the year.

# from upstream-corpus-movies.yml
? Movie.AAC.2.0.2008
: title: Movie
  audio_codec: AAC
  audio_channels: '2.0'
  year: 2008
  type: movie

# The same holds in a space-separated name, where the dot can only be the decimal point.

# from upstream-corpus-movies.yml
? M3GAN 2.0 (2025).mkv
: title: M3GAN 2.0
  year: 2025
  type: movie
  -audio_channels: '2.0'

# from upstream-corpus-movies.yml
? Ghost in the Shell 2.0 (2008)/Ghost in the Shell 2.0 (2008).mkv
: title: Ghost in the Shell 2.0
  year: 2008
  type: movie
  -audio_channels: '2.0'

# A YYYY-YYYY year range is a single year range, bracketed or not (#988)

