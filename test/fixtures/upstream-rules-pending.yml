# NOTE: the nine below depend on upstream's narrower allowed_languages (23
# entries). This port ships 60, so these short codes — 'sr', plus the
# bibliographic ISO 639-2 'may', 'ice', 'mal', 'est', 'mon', 'mar', 'ben' — do
# resolve to languages here. Divergence by design, not a gap to close: a rule
# that drops a whole-filepart language also breaks bare 'pt', 'English' and
# 'French', which upstream expects to be languages.

# from upstream-rules-common_words.yml
? may
: title: may

# from upstream-rules-common_words.yml
? ice
: title: ice

# from upstream-rules-common_words.yml
? mal
: title: mal

# from upstream-rules-common_words.yml
? est
: title: est

# from upstream-rules-common_words.yml
? mon
: title: mon

# from upstream-rules-common_words.yml
? mar
: title: mar

# from upstream-rules-common_words.yml
? ben
: title: ben

# from upstream-rules-common_words.yml
? sr
: title: sr

# from upstream-rules-common_words.yml
? sub
: title: sub
