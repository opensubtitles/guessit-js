# The name "Ed" must not be captured as an Ending Credits token (case-sensitive).
? "Show.Name.S03E21.22.FASTSUB.VOSTFR.HDTV.XviD.GROUP"
: title: Show Name
  season: 3
  episode: [21, 22]
  release_group: GROUP
  source: HDTV
  video_codec: Xvid
  other: Fast Subtitled
  type: episode

# --- #776: a release group casing must follow the actual match (the scene tag at the end of the
# filename), not a parent folder with a different casing ---
